<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘의 중앙</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f3f6fb; --surface:#ffffff; --text:#1c2433; --muted:#5d6b82;
  --line:#d9e0ec; --accent:#2f5bea; --accent-text:#ffffff;
  --urgent:#d8362f; --soon:#c77700; --ok:#1f8a5b;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#10151f; --surface:#1a2231; --text:#e8edf7; --muted:#9aa8c0;
    --line:#2b3649; --accent:#6f8cff; --accent-text:#0e1424;
    --urgent:#ff7a73; --soon:#f0b050; --ok:#5fd0a0;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#10151f; --surface:#1a2231; --text:#e8edf7; --muted:#9aa8c0;
  --line:#2b3649; --accent:#6f8cff; --accent-text:#0e1424;
  --urgent:#ff7a73; --soon:#f0b050; --ok:#5fd0a0;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  line-height:1.5}
main{max-width:560px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.6rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px;font-size:.95rem}
form,.item{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.add{display:grid;gap:10px;padding:16px;margin-bottom:20px}
label{font-size:.85rem;color:var(--muted);display:block;margin-bottom:4px}
input{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);
  border-radius:8px;background:var(--bg);color:var(--text)}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{font:inherit;font-weight:700;padding:11px;border:0;border-radius:8px;
  background:var(--accent);color:var(--accent-text);cursor:pointer}
#list{display:grid;gap:10px;padding:0;margin:0;list-style:none}
.item{display:flex;align-items:center;gap:14px;padding:14px 16px;border-left-width:6px}
.item.urgent{border-left-color:var(--urgent)}
.item.soon{border-left-color:var(--soon)}
.item.ok{border-left-color:var(--ok)}
.item.past{opacity:.55}
.dd{font-size:1.7rem;font-weight:800;min-width:92px;font-variant-numeric:tabular-nums}
.urgent .dd{color:var(--urgent)} .soon .dd{color:var(--soon)} .ok .dd{color:var(--ok)}
.info{flex:1;min-width:0}
.name{font-weight:700;overflow-wrap:anywhere}
.date{color:var(--muted);font-size:.85rem}
.del{border:0;background:none;color:var(--muted);font-size:1.3rem;cursor:pointer;padding:6px}
.empty{color:var(--muted);text-align:center;padding:28px 0}
.wordbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:20px}
.whead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.whead h2{font-size:1.1rem;margin:0}
.wtoggle{font:inherit;font-size:.85rem;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);cursor:pointer}
#words{list-style:none;margin:0;padding:0}
#words li{border-top:1px solid var(--line)}
#words li:first-child{border-top:0}
.wrow{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:none;border:0;padding:10px 0;cursor:default}
.wrow:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wbtns{display:flex;gap:6px}
.whead{flex-wrap:wrap;gap:8px}
.wbtns{flex-wrap:wrap}
.quiz{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.qword{font-size:1.3rem;font-weight:800;margin:0 0 4px}
.qopt{display:block;width:100%;text-align:left;font:inherit;padding:12px;margin-top:8px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);cursor:pointer}
.qopt:disabled{opacity:1;cursor:default}
.qopt.ok{border-color:var(--ok);font-weight:700}
.qopt.no{border-color:var(--urgent);text-decoration:line-through}
.qopt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.lvbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:20px}
.lvtop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
#lvtitle{font-size:1.1rem}
.bar{height:10px;border-radius:99px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
#lvfill{height:100%;width:0;background:var(--accent);transition:width .4s}
.lvinfo{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:.85rem;color:var(--muted)}
.lvbadges{margin-top:6px;font-size:1.3rem}
.lvmsg{margin:6px 0 0;font-size:.9rem;color:var(--accent);min-height:1.3em}
.w{font-weight:800;font-size:1.1rem}
.mean{margin-left:8px;color:var(--accent)}
.ex{display:block;color:var(--muted);font-size:.85rem;margin-top:2px}
#words.hide li:not(.show) .mean{visibility:hidden}
#words.hide .wrow{cursor:pointer}
#words li{display:flex;align-items:center;gap:8px}
.wrow{flex:1;width:auto}
.spk{flex:none;width:44px;height:44px;border:1px solid var(--line);border-radius:50%;background:var(--bg);color:var(--text);font-size:1.2rem;cursor:pointer}
.spk:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-text);font-size:1.6rem;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.25);z-index:20}
.fab:focus-visible,.mnav:focus-visible,#mtext:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.meal{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:min(320px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;z-index:20;display:none}
.meal.open{display:block}
.mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.mhead strong{font-size:1rem}
.mnav{width:40px;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font-size:1rem;cursor:pointer}
#mtext{width:100%;height:210px;resize:vertical;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
.mhint{color:var(--muted);font-size:.8rem;margin:6px 0 0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:4px}
.clock{text-align:right;font-variant-numeric:tabular-nums;line-height:1.25;flex:none}
.clock b{display:block;font-size:1.1rem}
.clock span{font-size:.75rem;color:var(--muted)}
main{padding-top:20px}
h1{font-size:1.5rem;letter-spacing:-.02em}
.lvbox,.wordbox,form.add,.item,.meal{border-radius:16px;box-shadow:0 1px 3px rgba(16,24,40,.07)}
.lvbox,.wordbox{padding:18px}
.wtoggle{border-radius:999px;padding:7px 13px;font-weight:600}
.wtoggle:hover{border-color:var(--accent)}
.btn{border-radius:10px;padding:12px}
.qopt{border-radius:12px}
.whead h2{font-size:1.05rem}
.wordbox.testing #words,.wordbox.testing #wnext,.wordbox.testing #wtoggle,.wordbox.testing #wclose{display:none}
.lvbox{position:relative}
.lvquest{margin-top:8px;font-size:.85rem;padding:6px 10px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
#lvfill{background:linear-gradient(90deg,var(--accent),var(--ok))}
.lvup{position:fixed;inset:0;z-index:50;pointer-events:none;overflow:hidden;display:flex;align-items:center;justify-content:center}
.lvup-card{background:var(--surface);border:2px solid var(--accent);border-radius:20px;padding:22px 34px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3);animation:lvpop .5s cubic-bezier(.2,1.4,.4,1)}
.lvup-big{font-size:1.6rem;font-weight:900;color:var(--accent);letter-spacing:.05em}
.lvup-lv{font-size:1.2rem;font-weight:800;margin-top:4px}
.conf{position:absolute;top:-30px;font-size:1.4rem;animation:conf 2.4s linear forwards}
.xppop{position:absolute;right:130px;top:14px;font-weight:800;color:var(--ok);animation:xpup 1s ease-out forwards;pointer-events:none}
@keyframes lvpop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes conf{to{transform:translateY(110vh) rotate(360deg)}}
@keyframes xpup{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-24px)}}
@media (prefers-reduced-motion:reduce){.conf{display:none}.lvup-card,.xppop{animation:none}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:20px;box-shadow:0 1px 3px rgba(16,24,40,.07)}
.tml{list-style:none;margin:0 0 8px;padding:0}.tml li{padding:6px 0;border-top:1px solid var(--line);font-size:.9rem}.tml li:first-child{border-top:0}.tml li.warn{color:var(--urgent);font-weight:700}
details summary{cursor:pointer;color:var(--muted);font-size:.85rem;padding:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font:inherit;font-size:.8rem;padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--text);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.tbig{font-size:2.6rem;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;margin:6px 0 10px}
#timer .wbtns{justify-content:center}
.wkbars{display:flex;gap:8px;align-items:flex-end;height:80px;margin:8px 0}
.wkc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;font-size:.7rem;color:var(--muted)}
.wkb{width:100%;max-width:28px;background:var(--accent);border-radius:6px 6px 2px 2px}
.alert{margin:0 0 16px;padding:10px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--urgent);color:var(--urgent);font-weight:700;font-size:.9rem}
.cform{display:grid;gap:8px;margin-top:8px}
.wordbox.testing #wrev,.wordbox.testing #wquiz,.wordbox.testing #custom{display:none}
</style>
</head>
<body>
<main>
  <header class="top"><h1>오늘의 중앙</h1><div class="clock" id="clock" aria-label="현재 시각"></div></header>
  <p class="sub">시험 D-day, 영단어, 급식표를 한곳에서 확인해요.</p>
  <div class="alert" id="dalert" hidden></div>

  <section class="lvbox" aria-label="내 레벨">
    <div class="lvtop"><strong id="lvtitle"></strong><button class="wtoggle" id="lvmute" type="button"></button></div>
    <div class="bar" id="lvbar" role="progressbar" aria-label="다음 레벨까지" aria-valuemin="0" aria-valuemax="100"><div id="lvfill"></div></div>
    <div class="lvinfo"><span id="lvxp"></span><span id="lvstreak"></span><span id="lvwords"></span></div>
    <div class="lvquest" id="lvquest"></div>
    <div class="lvbadges" id="lvbadges"></div>
    <p class="lvmsg" id="lvmsg" aria-live="polite"></p>
  </section>
  <button class="wtoggle" id="wshow" type="button" hidden style="margin-bottom:20px">오늘의 영단어 다시 보기</button>
  <section class="card" id="todaymeal" aria-label="오늘의 급식"><div class="whead"><h2>오늘의 급식 🍚</h2></div><ul id="tmlist" class="tml"></ul><details><summary>알레르기 설정</summary><div id="alg" class="chips"></div><p class="mhint">체크한 번호가 들어간 메뉴에 ⚠️가 표시돼요.</p></details></section>
  <section class="card" id="timer" aria-label="공부 타이머"><div class="whead"><h2>공부 타이머 ⏱️</h2><button class="wtoggle" id="tmode" type="button"></button></div><div class="tbig" id="tmr"></div><div class="wbtns"><button class="wtoggle" id="tgo" type="button"></button><button class="wtoggle" id="treset" type="button">초기화</button></div><p class="mhint">집중 25분을 끝까지 하면 +15 XP!</p></section>
  <section class="card" id="wk" aria-label="이번 주 기록"></section>
  <section class="wordbox" id="wordbox" aria-label="오늘의 영단어">
    <div class="whead">
      <h2>오늘의 영단어 5개</h2>
      <div class="wbtns">
        <button class="wtoggle" id="wrev" type="button">틀린 단어 복습</button>
        <button class="wtoggle" id="wquiz" type="button">영어 테스트</button>
        <button class="wtoggle" id="wnext" type="button">다른 단어</button>
        <button class="wtoggle" id="wtoggle" type="button">뜻 가리기</button>
        <button class="wtoggle" id="wclose" type="button">숨기기</button>
      </div>
    </div>
    <ul id="words"></ul>
    <div class="quiz" id="quiz" hidden></div>
    <details id="custom"><summary>＋ 나만의 단어 추가</summary><div class="cform"><input id="cw" placeholder="영단어" maxlength="30"><input id="cm" placeholder="뜻" maxlength="30"><input id="ce" placeholder="예문 (선택)" maxlength="80"><button class="wtoggle" id="cadd" type="button">추가</button></div><p class="mhint" id="cmsg"></p></details>
  </section>

  <form class="add" id="form">
    <div>
      <label for="title">무슨 일정인가요?</label>
      <input id="title" maxlength="30" placeholder="예: 과학 수행평가" required>
    </div>
    <div>
      <label for="date">날짜</label>
      <input id="date" type="date" required>
    </div>
    <button class="btn" type="submit">일정 추가</button>
  </form>

  <ul id="list"></ul>
  <p style="color:var(--muted);font-size:.8rem;text-align:center;margin-top:32px">마크 1.3 버전 · 급식·타이머·복습 추가</p>
</main>

<button class="fab" id="mfab" type="button" aria-label="급식표 열기">🍚</button>
<section class="meal" id="meal" aria-label="급식표">
  <div class="mhead">
    <button class="mnav" id="mprev" type="button" aria-label="전날">◀</button>
    <strong id="mlabel"></strong>
    <button class="mnav" id="mnext" type="button" aria-label="다음날">▶</button>
  </div>
  <textarea id="mtext" aria-label="급식 메뉴" readonly></textarea>
  <p class="mhint">김제중앙중학교 10월 중식이에요. 괄호 안 숫자는 알레르기 유발 식품 번호예요.</p>
</section>

<script>
var KEY = "dday-items";
var items = [];
try { items = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) { items = []; }

function save() { try { localStorage.setItem(KEY, JSON.stringify(items)); } catch (e) {} }

function daysLeft(dateStr) {
  var p = dateStr.split("-");
  var target = new Date(+p[0], +p[1] - 1, +p[2]);
  var now = new Date();
  var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((target - today) / 86400000);
}

function label(n) {
  if (n === 0) return "D-Day";
  return n > 0 ? "D-" + n : "D+" + Math.abs(n);
}

function render() {
  var list = document.getElementById("list");
  list.innerHTML = "";
  if (!items.length) {
    list.innerHTML = '<li class="empty">아직 일정이 없어요. 위에서 첫 일정을 추가해 보세요.</li>';
    return;
  }
  items.slice().sort(function (a, b) {
    var da = daysLeft(a.date), db = daysLeft(b.date);
    if ((da < 0) !== (db < 0)) return da < 0 ? 1 : -1;
    return Math.abs(da) - Math.abs(db);
  }).forEach(function (it) {
    var n = daysLeft(it.date);
    var cls = n < 0 ? "past" : n <= 3 ? "urgent" : n <= 14 ? "soon" : "ok";
    var li = document.createElement("li");
    li.className = "item " + cls;
    var dd = document.createElement("div"); dd.className = "dd"; dd.textContent = label(n);
    var info = document.createElement("div"); info.className = "info";
    var nm = document.createElement("div"); nm.className = "name"; nm.textContent = it.title;
    var dt = document.createElement("div"); dt.className = "date"; dt.textContent = it.date;
    info.appendChild(nm); info.appendChild(dt);
    var del = document.createElement("button");
    del.className = "del"; del.type = "button"; del.textContent = "✕";
    del.setAttribute("aria-label", it.title + " 삭제");
    del.onclick = function () {
      items = items.filter(function (x) { return x.id !== it.id; });
      save(); render();
    };
    li.appendChild(dd); li.appendChild(info); li.appendChild(del);
    list.appendChild(li);
  });
}

document.getElementById("form").addEventListener("submit", function (e) {
  e.preventDefault();
  var t = document.getElementById("title"), d = document.getElementById("date");
  items.push({ id: Date.now(), title: t.value.trim(), date: d.value });
  save(); render();
  t.value = ""; d.value = ""; t.focus();
});

render();

window.JGX = (function () {
  var K = "jg-extra", X = { wrong: [], custom: [], allergy: [], hist: {}, acc: {} };
  try { var r = JSON.parse(localStorage.getItem(K) || "null"); if (r) for (var k in X) if (r[k] !== undefined) X[k] = r[k]; } catch (e) {}
  return {
    X: X,
    save: function () { try { localStorage.setItem(K, JSON.stringify(X)); } catch (e) {} },
    tk: function () { var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  };
})();

/* 레벨업 시스템 (이 기기 브라우저에 저장) */
(function () {
  var KEY = "jungang-level";
  var S = { xp: 0, streak: 0, last: "", learned: [], ms: [], muted: false, td: { d: "", w: [] }, pb: "", qd: "" };
  try {
    var raw = JSON.parse(localStorage.getItem(KEY) || "null");
    if (raw) for (var k in S) if (raw[k] !== undefined) S[k] = raw[k];
  } catch (e) {}
  var TITLES = ["새싹", "연필", "노트", "책벌레", "단어박사", "영어고수", "우등생", "학급의 별", "중앙의 영웅", "중앙의 전설"];
  var MILES = [[5, "🥉"], [10, "🥈"], [20, "🥇"], [30, "💎"], [40, "👑"]];
  function $(id) { return document.getElementById(id); }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  function dayKey(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function levelOf(xp) { return Math.floor(Math.sqrt(xp / 20)) + 1; }

  var ctx = null;
  function tone(freq, start, dur, type, vol) {
    if (S.muted) return;
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === "suspended") ctx.resume();
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type || "sine"; o.frequency.value = freq;
      var t = ctx.currentTime + start;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  }
  function sndRight() { tone(659, 0, 0.12, "sine"); tone(988, 0.1, 0.22, "sine"); }
  function sndWrong() { tone(220, 0, 0.22, "sawtooth", 0.12); tone(165, 0.18, 0.3, "sawtooth", 0.12); }
  function sndLevel(delay) {
    [523, 659, 784, 1047].forEach(function (f, i) { tone(f, (delay || 0) + i * 0.12, 0.25, "triangle"); });
  }

  function celebrate(lv) {
    var o = document.createElement("div"); o.className = "lvup"; o.setAttribute("role", "status");
    var c = document.createElement("div"); c.className = "lvup-card";
    var a = document.createElement("div"); a.className = "lvup-big"; a.textContent = "LEVEL UP!";
    var b = document.createElement("div"); b.className = "lvup-lv"; b.textContent = "Lv." + lv + " " + TITLES[Math.min(lv - 1, TITLES.length - 1)];
    c.appendChild(a); c.appendChild(b); o.appendChild(c);
    var em = ["🎉", "✨", "⭐", "🎊"];
    for (var i = 0; i < 20; i++) {
      var s = document.createElement("span"); s.className = "conf"; s.textContent = em[i % 4];
      s.style.left = (Math.random() * 100) + "%"; s.style.animationDelay = (Math.random() * 0.6) + "s";
      o.appendChild(s);
    }
    document.body.appendChild(o);
