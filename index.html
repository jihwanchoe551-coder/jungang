<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘의 중앙</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f3f6fb; --surface:#ffffff; --text:#1c2433; --muted:#5d6b82;
  --line:#d9e0ec; --accent:#2f5bea; --accent-text:#ffffff;
  --urgent:#d8362f; --soon:#c77700; --ok:#1f8a5b;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#10151f; --surface:#1a2231; --text:#e8edf7; --muted:#9aa8c0;
    --line:#2b3649; --accent:#6f8cff; --accent-text:#0e1424;
    --urgent:#ff7a73; --soon:#f0b050; --ok:#5fd0a0;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#10151f; --surface:#1a2231; --text:#e8edf7; --muted:#9aa8c0;
  --line:#2b3649; --accent:#6f8cff; --accent-text:#0e1424;
  --urgent:#ff7a73; --soon:#f0b050; --ok:#5fd0a0;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  line-height:1.5}
main{max-width:560px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.6rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px;font-size:.95rem}
form,.item{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.add{display:grid;gap:10px;padding:16px;margin-bottom:20px}
label{font-size:.85rem;color:var(--muted);display:block;margin-bottom:4px}
input{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);
  border-radius:8px;background:var(--bg);color:var(--text)}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{font:inherit;font-weight:700;padding:11px;border:0;border-radius:8px;
  background:var(--accent);color:var(--accent-text);cursor:pointer}
#list{display:grid;gap:10px;padding:0;margin:0;list-style:none}
.item{display:flex;align-items:center;gap:14px;padding:14px 16px;border-left-width:6px}
.item.urgent{border-left-color:var(--urgent)}
.item.soon{border-left-color:var(--soon)}
.item.ok{border-left-color:var(--ok)}
.item.past{opacity:.55}
.dd{font-size:1.7rem;font-weight:800;min-width:92px;font-variant-numeric:tabular-nums}
.urgent .dd{color:var(--urgent)} .soon .dd{color:var(--soon)} .ok .dd{color:var(--ok)}
.info{flex:1;min-width:0}
.name{font-weight:700;overflow-wrap:anywhere}
.date{color:var(--muted);font-size:.85rem}
.del{border:0;background:none;color:var(--muted);font-size:1.3rem;cursor:pointer;padding:6px}
.empty{color:var(--muted);text-align:center;padding:28px 0}
.wordbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:20px}
.whead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.whead h2{font-size:1.1rem;margin:0}
.wtoggle{font:inherit;font-size:.85rem;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);cursor:pointer}
#words{list-style:none;margin:0;padding:0}
#words li{border-top:1px solid var(--line)}
#words li:first-child{border-top:0}
.wrow{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:none;border:0;padding:10px 0;cursor:default}
.wrow:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wbtns{display:flex;gap:6px}
.w{font-weight:800;font-size:1.1rem}
.mean{margin-left:8px;color:var(--accent)}
.ex{display:block;color:var(--muted);font-size:.85rem;margin-top:2px}
#words.hide li:not(.show) .mean{visibility:hidden}
#words.hide .wrow{cursor:pointer}
#words li{display:flex;align-items:center;gap:8px}
.wrow{flex:1;width:auto}
.spk{flex:none;width:44px;height:44px;border:1px solid var(--line);border-radius:50%;background:var(--bg);color:var(--text);font-size:1.2rem;cursor:pointer}
.spk:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-text);font-size:1.6rem;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.25);z-index:20}
.fab:focus-visible,.mnav:focus-visible,#mtext:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.meal{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:min(320px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;z-index:20;display:none}
.meal.open{display:block}
.mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.mhead strong{font-size:1rem}
.mnav{width:40px;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font-size:1rem;cursor:pointer}
#mtext{width:100%;height:210px;resize:vertical;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
.mhint{color:var(--muted);font-size:.8rem;margin:6px 0 0}
</style>
</head>
<body>
<main>
  <h1>오늘의 중앙</h1>
  <p class="sub">시험 D-day, 영단어, 급식표를 한곳에서 확인해요.</p>

  <button class="wtoggle" id="wshow" type="button" hidden style="margin-bottom:20px">오늘의 영단어 다시 보기</button>
  <section class="wordbox" id="wordbox" aria-label="오늘의 영단어">
    <div class="whead">
      <h2>오늘의 영단어 5개</h2>
      <div class="wbtns">
        <button class="wtoggle" id="wtoggle" type="button">뜻 가리기</button>
        <button class="wtoggle" id="wclose" type="button">숨기기</button>
      </div>
    </div>
    <ul id="words"></ul>
  </section>

  <form class="add" id="form">
    <div>
      <label for="title">무슨 일정인가요?</label>
      <input id="title" maxlength="30" placeholder="예: 과학 수행평가" required>
    </div>
    <div>
      <label for="date">날짜</label>
      <input id="date" type="date" required>
    </div>
    <button class="btn" type="submit">일정 추가</button>
  </form>

  <ul id="list"></ul>
</main>

<button class="fab" id="mfab" type="button" aria-label="급식표 열기">🍚</button>
<section class="meal" id="meal" aria-label="급식표">
  <div class="mhead">
    <button class="mnav" id="mprev" type="button" aria-label="전날">◀</button>
    <strong id="mlabel"></strong>
    <button class="mnav" id="mnext" type="button" aria-label="다음날">▶</button>
  </div>
  <textarea id="mtext" aria-label="급식 메뉴" readonly></textarea>
  <p class="mhint">김제중앙중학교 10월 중식이에요. 괄호 안 숫자는 알레르기 유발 식품 번호예요.</p>
</section>

<script>
var KEY = "dday-items";
var items = [];
try { items = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) { items = []; }

function save() { try { localStorage.setItem(KEY, JSON.stringify(items)); } catch (e) {} }

function daysLeft(dateStr) {
  var p = dateStr.split("-");
  var target = new Date(+p[0], +p[1] - 1, +p[2]);
  var now = new Date();
  var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((target - today) / 86400000);
}

function label(n) {
  if (n === 0) return "D-Day";
  return n > 0 ? "D-" + n : "D+" + Math.abs(n);
}

function render() {
  var list = document.getElementById("list");
  list.innerHTML = "";
  if (!items.length) {
    list.innerHTML = '<li class="empty">아직 일정이 없어요. 위에서 첫 일정을 추가해 보세요.</li>';
    return;
  }
  items.slice().sort(function (a, b) {
    var da = daysLeft(a.date), db = daysLeft(b.date);
    if ((da < 0) !== (db < 0)) return da < 0 ? 1 : -1;
    return Math.abs(da) - Math.abs(db);
  }).forEach(function (it) {
    var n = daysLeft(it.date);
    var cls = n < 0 ? "past" : n <= 3 ? "urgent" : n <= 14 ? "soon" : "ok";
    var li = document.createElement("li");
    li.className = "item " + cls;
    var dd = document.createElement("div"); dd.className = "dd"; dd.textContent = label(n);
    var info = document.createElement("div"); info.className = "info";
    var nm = document.createElement("div"); nm.className = "name"; nm.textContent = it.title;
    var dt = document.createElement("div"); dt.className = "date"; dt.textContent = it.date;
    info.appendChild(nm); info.appendChild(dt);
    var del = document.createElement("button");
    del.className = "del"; del.type = "button"; del.textContent = "✕";
    del.setAttribute("aria-label", it.title + " 삭제");
    del.onclick = function () {
      items = items.filter(function (x) { return x.id !== it.id; });
      save(); render();
    };
    li.appendChild(dd); li.appendChild(info); li.appendChild(del);
    list.appendChild(li);
  });
}

document.getElementById("form").addEventListener("submit", function (e) {
  e.preventDefault();
  var t = document.getElementById("title"), d = document.getElementById("date");
  items.push({ id: Date.now(), title: t.value.trim(), date: d.value });
  save(); render();
  t.value = ""; d.value = ""; t.focus();
});

render();

/* 오늘의 영단어: 날짜마다 5개씩 바뀜 (모두에게 같은 단어) */

    ["cooperate", "협력하다", "We must cooperate to win."],
    ["consume", "소비하다, 먹다", "Cars consume a lot of fuel."],
    ["evidence", "증거, 근거", "There is no evidence for that claim."],
    ["tend to", "~하는 경향이 있다", "Teenagers tend to stay up late."],
    ["isolate", "고립시키다, 분리하다", "Sick patients were isolated from others."],
    ["contrast", "대조, 차이", "The contrast between the two is clear."],
    ["suffer", "고통받다, 시달리다", "Many people suffer from stress."],
    ["advantage", "장점, 이점", "Being tall is an advantage in basketball."]
  ];
  var d = new Date();
  var day = Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
  var start = (day * 5) % W.length;
  var ul = document.getElementById("words");
  function speak(t) {
    try {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(t);
      u.lang = "en-US"; u.rate = 0.85;
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }
  var canSpeak = !!(window.speechSynthesis && window.SpeechSynthesisUtterance);
  for (var i = 0; i < 5; i++) {
    var it = W[(start + i) % W.length];
    var li = document.createElement("li");
    var b = document.createElement("button");
    b.type = "button"; b.className = "wrow";
    var w = document.createElement("span"); w.className = "w"; w.textContent = it[0];
    var m = document.createElement("span"); m.className = "mean"; m.textContent = it[1];
    var ex = document.createElement("span"); ex.className = "ex"; ex.textContent = it[2];
    b.appendChild(w); b.appendChild(m); b.appendChild(ex);
    b.onclick = (function (row) { return function () { row.classList.toggle("show"); }; })(li);
    li.appendChild(b);
    if (canSpeak) {
      var sp = document.createElement("button");
      sp.type = "button"; sp.className = "spk"; sp.textContent = "🔊";
      sp.setAttribute("aria-label", it[0] + " 발음 듣기");
      sp.onclick = (function (t) { return function () { speak(t); }; })(it[0]);
      li.appendChild(sp);
    }
    ul.appendChild(li);
  }
  var tg = document.getElementById("wtoggle");
  tg.onclick = function () {
    var hide = ul.classList.toggle("hide");
    tg.textContent = hide ? "뜻 보기" : "뜻 가리기";
    var rows = ul.children;
    for (var j = 0; j < rows.length; j++) rows[j].classList.remove("show");
  };

  var box = document.getElementById("wordbox"), showBtn = document.getElementById("wshow");
  function setHidden(h) {
    box.hidden = h; showBtn.hidden = !h;
    try { localStorage.setItem("words-hidden", h ? "1" : "0"); } catch (e) {}
  }
  document.getElementById("wclose").onclick = function () { setHidden(true); };
  showBtn.onclick = function () { setHidden(false); };
  var saved = false;
  try { saved = localStorage.getItem("words-hidden") === "1"; } catch (e) {}
  box.hidden = saved; showBtn.hidden = !saved;
})();

  }
